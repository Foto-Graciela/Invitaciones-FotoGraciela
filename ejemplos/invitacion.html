<head>

<style>
/* ============================================================
   MOTOR DE INVITACIONES DE MUESTRA · LUMINARIA
   Un archivo, ocho diseños. Se elige con ?t=
   boda · xv · bautizo · cumpleanos · baby
   graduacion · comunion · empresa
   Los textos de cada uno están en DISENOS, abajo en el script.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--porcelana);color:var(--tinta);
  font-family:var(--prosa);font-weight:300;line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

/* textura de papel hecha con degradados, sin archivos externos */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(circle at 18% 22%, var(--grano) 0 1px, transparent 1px),
    radial-gradient(circle at 62% 68%, var(--grano) 0 1px, transparent 1px),
    radial-gradient(circle at 84% 38%, var(--grano) 0 1px, transparent 1px);
  background-size:37px 37px, 53px 53px, 71px 71px;
}

.hoja{max-width:560px;margin:0 auto;position:relative;z-index:1}

/* ---------- piezas comunes ---------- */
section{padding:var(--paso) 32px;text-align:center;position:relative;overflow:hidden}
.alt{background:var(--marfil)}
.rotulo{
  font-family:var(--util);font-size:.62rem;font-weight:400;
  letter-spacing:.4em;text-transform:uppercase;color:var(--tinta-suave);
}
.titulo{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.3;margin-top:14px;
}
p.suave{color:var(--tinta-suave);font-size:1.02rem}
.angosto{max-width:32ch;margin-inline:auto}

.foil{
  background:var(--foil);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:brillo 14s linear infinite;
}
@keyframes brillo{0%{background-position:0% 50%}100%{background-position:300% 50%}}

.marca-agua{
  position:absolute;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none;
  font-family:var(--display);font-size:clamp(6rem,30vw,11rem);line-height:1;
  color:var(--oro);opacity:.05;letter-spacing:-.04em;user-select:none;
}
.encima{position:relative;z-index:1}

.ornamento{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto;color:var(--oro)}
.ornamento svg{width:clamp(52px,15vw,86px);height:auto;opacity:.85}
.ornamento svg.espejo{transform:scaleX(-1)}
.ornamento .monograma{
  font-family:var(--display);font-size:.95rem;letter-spacing:.1em;color:var(--oro-hondo);
  border:1px solid var(--linea);border-radius:50%;width:46px;height:46px;
  display:grid;place-items:center;flex:0 0 auto;
}
.rama{position:relative;width:60%;height:1px;margin:22px auto;
  background:linear-gradient(90deg,transparent,var(--linea),transparent)}
.rama::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
  transform:translate(-50%,-50%) rotate(45deg);background:var(--oro);opacity:.85}

.boton{
  display:inline-block;margin-top:20px;padding:13px 30px;
  background:var(--oro);color:var(--sobre-oro);text-decoration:none;
  font-family:var(--util);font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;
  transition:transform .3s,opacity .3s;
}
.boton:hover{transform:translateY(-2px);opacity:.92}
.boton.hueco{background:transparent;border:1px solid var(--oro);color:var(--oro-hondo)}

/* ---------- el sobre ---------- */
.sobre{
  position:fixed;inset:0;z-index:40;background:var(--marfil-hondo);
  display:grid;place-items:center;padding:32px;text-align:center;
  transition:opacity .9s ease,visibility .9s;
}
.sobre.abierto{opacity:0;visibility:hidden}
.sobre .carta{max-width:26rem;animation:sube 1.1s ease both}
.sobre .lacre{
  width:96px;height:96px;margin:0 auto 30px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 34% 30%, var(--oro-claro), var(--oro) 44%, var(--oro-hondo));
  display:grid;place-items:center;color:var(--sobre-oro);
  font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.5);
  animation:respira 4.5s ease-in-out infinite;
}
.sobre .nombres{font-family:var(--display);font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.2;margin-bottom:10px}
.sobre .fecha{font-family:var(--util);letter-spacing:.4em;text-transform:uppercase;font-size:.66rem;color:var(--tinta-suave);margin-bottom:32px}
@keyframes sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* ---------- portada ---------- */
.portada{
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--portada-fondo);padding:74px 32px;
}
.portada .marco{position:absolute;inset:20px;border:1px solid var(--linea);pointer-events:none}
.portada .marco::before,.portada .marco::after{
  content:"";position:absolute;width:14px;height:14px;border:1px solid var(--oro);
}
.portada .marco::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.portada .marco::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.portada h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.4rem,12vw,3.5rem);line-height:1.18;margin:4px 0;
}
.ampersand{font-family:var(--prosa);font-style:italic;font-size:1.6rem;color:var(--oro);margin:2px 0}
.portada-fecha{font-family:var(--util);font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--tinta-suave);margin-top:28px}
.portada-lugar{font-family:var(--util);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--tinta-suave);margin-top:10px;opacity:.8}
.baja{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  font-family:var(--util);font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tinta-suave)}
.baja i{width:1px;height:26px;background:var(--oro);animation:cae 2.2s infinite}
@keyframes cae{0%{opacity:0;transform:scaleY(.2)}50%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.2)}}

/* ---------- cuenta regresiva ---------- */
.reloj{display:flex;justify-content:center;gap:8px;margin-top:30px}
.reloj div{flex:1;max-width:78px;padding:16px 4px;border:1px solid var(--linea)}
.reloj b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:400}
.reloj span{font-family:var(--util);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-suave)}

/* ---------- anfitriones ---------- */
.anfitriones{margin-top:30px}
.anfitriones .par p:not(.rotulo){font-family:var(--display);font-size:1.14rem;line-height:1.6;margin-top:8px}

/* ---------- itinerario ---------- */
.hitos{list-style:none;margin:40px 0 0 56px;text-align:left;position:relative}
.hitos::before{content:"";position:absolute;left:-34px;top:10px;bottom:10px;width:1px;background:var(--linea)}
.hitos li{position:relative;padding-bottom:32px}
.hitos li:last-child{padding-bottom:0}
.sello{
  position:absolute;left:-56px;top:-2px;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--linea);background:var(--porcelana);
  display:grid;place-items:center;color:var(--oro-hondo);
}
.sello svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.hitos .hora{font-family:var(--util);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--oro-hondo)}
.hitos h3{font-family:var(--display);font-weight:400;font-size:1.22rem;margin:5px 0 4px}
.hitos p{font-size:.9rem;color:var(--tinta-suave);line-height:1.6}

/* ---------- lugares ---------- */
.lugar{border:1px solid var(--linea);padding:32px 26px;margin-top:20px;background:var(--porcelana)}
.lugar h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:10px 0 4px}
.lugar p:not(.rotulo){font-size:.9rem;color:var(--tinta-suave)}

/* ---------- detalles ---------- */
.detalle{padding:28px 0;border-bottom:1px solid var(--linea-suave)}
.detalle:last-child{border-bottom:none}
.detalle p.grande{font-family:var(--display);font-size:1.3rem;margin:10px 0 6px}
.detalle .aviso{font-size:.89rem;color:var(--tinta-suave);max-width:34ch;margin-inline:auto}
.muestras{display:flex;gap:9px;justify-content:center;margin-top:14px}
.muestras i{width:26px;height:26px;border-radius:50%;border:1px solid var(--linea-suave);display:block}

/* ---------- historia ---------- */
.historia p.angosto{margin-top:18px;font-size:1.02rem;color:var(--tinta-suave)}
.historia p.angosto:first-of-type::first-letter{
  font-family:var(--display);font-size:1.7em;color:var(--oro-hondo);line-height:1;padding-right:.06em;
}

/* ---------- galería ---------- */
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:30px}
.galeria div{
  aspect-ratio:3/4;border:1px solid var(--linea-suave);
  display:grid;place-items:center;color:var(--oro);opacity:.7;
  background:linear-gradient(150deg,var(--marfil),var(--marfil-hondo));
}
.galeria div:nth-child(2n){background:linear-gradient(30deg,var(--marfil-hondo),var(--marfil))}
.galeria svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.1}
.galeria-nota{margin-top:16px;font-family:var(--util);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-suave)}

/* ---------- confirmar ---------- */
.caja{border:1px solid var(--linea);padding:32px 26px;margin-top:26px;background:var(--porcelana)}
.rsvp input{
  width:100%;margin-top:16px;padding:13px 18px;border:1px solid var(--linea);
  background:transparent;color:var(--tinta);font-family:var(--prosa);font-size:1rem;text-align:center;
}
.rsvp input:focus{outline:none;border-color:var(--oro)}
.estado{margin-top:18px;font-size:.94rem;color:var(--tinta-suave);min-height:3em;display:flex;align-items:center;justify-content:center}
.estado b{color:var(--oro-hondo);font-weight:400;font-family:var(--display);font-size:1.14em}
.pase{
  margin-top:18px;border:1px dashed var(--linea);padding:18px;
  font-family:var(--util);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--oro-hondo);
}

/* ---------- cierre ---------- */
.hashtag{font-family:var(--display);font-size:1.5rem;color:var(--oro-hondo);margin-top:14px}

/* ---------- crédito ---------- */
.estudio{background:#0b0716;color:#f3eef8}
.estudio p{font-family:var(--util);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:#a294b6;line-height:2.3}
.estudio a{color:#c76fa6;text-decoration:none}

/* ---------- barra de secciones ---------- */
.barra{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;
  display:flex;gap:4px;padding:6px;border-radius:100px;
  background:var(--barra);backdrop-filter:blur(10px);
  border:1px solid var(--linea);box-shadow:0 12px 34px -18px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .6s;
}
.barra.ver{opacity:1;pointer-events:auto}
.barra a{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  color:var(--tinta-suave);text-decoration:none;transition:background .25s,color .25s;
}
.barra a:hover{background:var(--linea);color:var(--oro-hondo)}
.barra svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- aparecer ---------- */
.rev{opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform .9s ease}
.rev.ok{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none}*{animation:none!important}}

.aviso-muestra{
  position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;
  background:rgba(0,0,0,.7);color:#fff;padding:5px;
  font-family:system-ui,sans-serif;font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;
}
</style>
</head>

      '<h2 class="titulo">Detalles a tomar en cuenta</h2>' +
      '<div style="margin-top:22px">' + detalles + '</div>' +
    '</section>' +

    historia +

    '<section class="alt rev">' +
      '<p class="rotulo">Los recuerdos</p>' +
      '<h2 class="titulo">La galería del evento</h2>' + galeria +
      '<p class="galeria-nota">Aquí van tus fotos</p>' +
    '</section>' +

    '<section id="rsvp" class="rsvp rev">' +
      '<p class="rotulo">Confirmación de asistencia</p>' +
      '<h2 class="titulo">' + (d.nombre2 ? "Nos encantaría contar contigo" : "Me encantaría contar contigo") + '</h2>' +
      '<div class="caja">' +
        '<p class="suave" style="font-size:.92rem">Escribe tu nombre tal como aparece en tu invitación</p>' +
        '<input id="quien" type="text" placeholder="Tu nombre completo" maxlength="34" autocomplete="off">' +
        '<div class="estado" id="estado">Aquí aparecerán tus pases</div>' +
        '<button class="boton" id="confirmar">Confirmar asistencia</button>' +
      '</div>' +
    '</section>' +

    '<section class="alt">' +
      '<span class="marca-agua">' + d.monograma + '</span>' +
      '<div class="encima rev">' + ornamento() +
        '<h2 class="titulo">' + d.cierre + '</h2>' +
        '<p class="hashtag">' + d.hashtag + '</p>' +
        '<p class="rotulo" style="margin-top:18px">Comparte tus fotos con este hashtag</p>' +
      '</div>' +
    '</section>' +

    '<section class="estudio">' +
      '<p>Invitación digital hecha por<br><a href="../index.html">Invitaciones Luminaria</a></p>' +
    '</section>';

  /* ---- abrir el sobre ---- */
  var sobre = document.getElementById("sobre");
  function abrir(){
    sobre.classList.add("abierto");
    document.getElementById("barra").classList.add("ver");
  }
  document.getElementById("abrir").addEventListener("click", abrir);
  document.getElementById("lacre").addEventListener("click", abrir);

  /* ---- cuenta regresiva ---- */
  var meta = new Date(d.fecha).getTime();
  function tic(){
    var s = Math.max(0, Math.floor((meta - Date.now()) / 1000));
    document.getElementById("dd").textContent = Math.floor(s / 86400);
    document.getElementById("hh").textContent = Math.floor(s % 86400 / 3600);
    document.getElementById("mm").textContent = Math.floor(s % 3600 / 60);
    document.getElementById("ss").textContent = s % 60;
  }
  tic(); setInterval(tic, 1000);

  /* ---- buscador de pases (demostración) ---- */
  var quien = document.getElementById("quien");
  var estado = document.getElementById("estado");
  var confirmar = document.getElementById("confirmar");

  quien.addEventListener("input", function(){
    var n = quien.value.trim();
    if (n.length < 3){ estado.textContent = "Aquí aparecerán tus pases"; return; }
    var cuantos = (n.replace(/\s/g, "").length % 3) + 1;
    estado.innerHTML = "Hola <b>" + n.replace(/</g, "") + "</b>, tienes " + cuantos +
                       (cuantos === 1 ? " pase reservado" : " pases reservados");
  });

  confirmar.addEventListener("click", function(){
    var n = quien.value.trim();
    if (!n){ estado.textContent = "Escribe tu nombre primero"; return; }
    estado.textContent = "¡Gracias! Tu lugar quedó confirmado.";
    if (!document.querySelector(".pase")){
      var p = document.createElement("div");
      p.className = "pase";
      p.textContent = "Pase de acceso enviado";
      estado.parentNode.appendChild(p);
    }
  });

  /* ---- aparecer al bajar ---- */
  var obs = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("ok"); obs.unobserve(e.target); } });
  }, { threshold:.1 });
  document.querySelectorAll(".rev").forEach(function(el){ obs.observe(el); });
})();
</script>
</body>
</html>
