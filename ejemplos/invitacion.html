<style>
/* ============================================================
   MOTOR DE INVITACIONES DE EJEMPLO
   Un archivo, ocho diseños. Se elige con ?t=
   boda · xv · bautizo · cumpleanos · baby · graduacion
   comunion · empresa
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--fondo);color:var(--tinta);
  font-family:var(--cuerpo);font-weight:300;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}

.hoja{max-width:520px;margin:0 auto;position:relative}
section{padding:66px 30px;text-align:center;position:relative}
.rot{
  font-family:var(--cuerpo);font-size:.62rem;letter-spacing:.4em;
  text-transform:uppercase;color:var(--acento);margin-bottom:20px;
}
h1{font-family:var(--titulo);font-weight:400;line-height:1.1}
h2{font-family:var(--titulo);font-weight:400;font-size:1.9rem;line-height:1.25;margin-bottom:8px}
h3{font-family:var(--titulo);font-weight:400;font-size:1.25rem;margin-bottom:4px}
p{font-size:.95rem;color:var(--suave)}
.linea{width:1px;height:52px;background:var(--acento);margin:26px auto;opacity:.5}

/* ---------- portada ---------- */
.portada{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:var(--portada);padding:70px 30px;
}
.adorno{width:66px;margin:0 auto 26px;opacity:.85}
.adorno svg{width:100%;height:auto;display:block}
.portada h1{font-size:clamp(2.6rem,13vw,3.9rem);margin:6px 0}
.portada .y{font-family:var(--titulo);font-style:italic;font-size:1.5rem;color:var(--acento);margin:2px 0}
.portada .fecha{
  font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--suave);margin-top:26px;
}
.bajar{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--suave);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.bajar i{display:block;width:1px;height:26px;background:var(--acento);animation:cae 2s infinite}
@keyframes cae{0%{opacity:0;transform:scaleY(.2)}50%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.2)}}

/* ---------- cuenta regresiva ---------- */
.reloj{display:flex;justify-content:center;gap:6px;margin-top:26px}
.reloj div{
  flex:1;max-width:82px;padding:16px 6px;border-radius:10px;
  background:var(--caja);border:1px solid var(--borde);
}
.reloj b{display:block;font-family:var(--titulo);font-size:1.7rem;font-weight:400;color:var(--tinta)}
.reloj span{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave)}

/* ---------- bloques ---------- */
.alt{background:var(--caja)}
.tarjeta{
  border:1px solid var(--borde);border-radius:14px;
  padding:28px 24px;margin-top:18px;background:var(--fondo);
}
.tarjeta .dato{font-size:.88rem;color:var(--suave);margin-top:6px}
.boton{
  display:inline-block;margin-top:18px;padding:12px 28px;border-radius:100px;
  background:var(--acento);color:var(--sobreAcento);border:none;
  font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
  text-decoration:none;
}
.boton.linea{background:transparent;border:1px solid var(--acento);color:var(--acento)}

.programa{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:0}
.programa li{
  display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:baseline;
  padding:16px 0;border-bottom:1px solid var(--borde);text-align:left;
}
.programa li:last-child{border-bottom:none}
.programa time{font-size:.72rem;letter-spacing:.14em;color:var(--acento)}
.programa strong{font-family:var(--titulo);font-weight:400;font-size:1.05rem}

.pastillas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pastillas span{
  border:1px solid var(--borde);border-radius:100px;padding:8px 18px;
  font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);
}

/* ---------- confirmar ---------- */
.rsvp .tarjeta{max-width:340px;margin-inline:auto}
.rsvp input{
  width:100%;margin-top:14px;padding:12px 16px;border-radius:100px;
  border:1px solid var(--borde);background:var(--fondo);color:var(--tinta);
  font-family:var(--cuerpo);font-size:.92rem;text-align:center;
}
.rsvp input:focus{outline:none;border-color:var(--acento)}
.pases{
  margin-top:16px;font-size:.88rem;color:var(--suave);
  min-height:2.4em;display:flex;align-items:center;justify-content:center;
}
.pases b{color:var(--acento);font-weight:400}

/* ---------- pie ---------- */
footer{padding:40px 30px 54px;text-align:center;background:var(--portada)}
footer p{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--suave)}
footer a{color:var(--acento);text-decoration:none}

/* ---------- aparecer al bajar ---------- */
.rev{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.rev.ok{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none}*{animation:none!important}}

/* ---------- aviso de muestra ---------- */
.muestra{
  position:fixed;top:0;left:0;right:0;z-index:9;text-align:center;
  background:rgba(0,0,0,.72);color:#fff;padding:6px;
  font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;
  font-family:system-ui,sans-serif;
}
</style>

      '<p class="rot">Detalles</p><h2>Regalos</h2>' +
      '<p style="max-width:30ch;margin:14px auto 0">' + esc(d.regalos) + '</p>' +
    '</section>' +

    '<section class="alt rsvp rev">' +
      '<p class="rot">Confirma</p><h2>¿Nos acompañas?</h2>' +
      '<div class="tarjeta">' +
        '<p style="font-size:.86rem">Escribe tu nombre como aparece en la lista</p>' +
        '<input id="quien" type="text" placeholder="Tu nombre" maxlength="30">' +
        '<div class="pases" id="pases">Aquí aparecerán tus pases</div>' +
        '<button class="boton" id="confirmar">Confirmar asistencia</button>' +
      '</div>' +
    '</section>' +

    '<footer>' +
      '<p>Invitación hecha por<br><a href="../index.html">Invitaciones Luminaria</a></p>' +
    '</footer>';

  /* ---------- cuenta regresiva ---------- */
  var meta = new Date(d.fecha).getTime();
  function tic(){
    var f = Math.max(0, meta - Date.now());
    var s = Math.floor(f / 1000);
    document.getElementById("dd").textContent = Math.floor(s / 86400);
    document.getElementById("hh").textContent = Math.floor(s % 86400 / 3600);
    document.getElementById("mm").textContent = Math.floor(s % 3600 / 60);
    document.getElementById("ss").textContent = s % 60;
  }
  tic(); setInterval(tic, 1000);

  /* ---------- demostración del buscador de pases ---------- */
  var quien  = document.getElementById("quien");
  var pases  = document.getElementById("pases");
  var boton  = document.getElementById("confirmar");

  quien.addEventListener("input", function(){
    var n = quien.value.trim();
    if (n.length < 3){ pases.innerHTML = "Aquí aparecerán tus pases"; return; }
    // en una invitación real esto se busca en la lista del cliente
    var cuantos = (n.replace(/\s/g,"").length % 3) + 1;
    pases.innerHTML = "Hola <b>" + esc(n) + "</b>, tienes <b>" +
                      cuantos + (cuantos === 1 ? " pase" : " pases") + "</b> apartados";
  });

  boton.addEventListener("click", function(){
    pases.innerHTML = quien.value.trim()
      ? "<b>¡Gracias! Tu asistencia quedó confirmada.</b>"
      : "Escribe tu nombre primero";
  });

  /* ---------- aparecer al bajar ---------- */
  var obs = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("ok"); obs.unobserve(e.target); } });
  }, { threshold:.12 });
  document.querySelectorAll(".rev").forEach(function(el){ obs.observe(el); });
})();
</script>
</body>
</html>
